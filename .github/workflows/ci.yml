name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: |
          gopath="$(go env GOPATH)"
          export PATH="$gopath/bin:$PATH"
          actionlint
      - run: uv tool install zizmor==1.30.1
      - run: uv tool run zizmor --offline .github/
      - name: Render and lint consumer workflows
        run: |
          set -euo pipefail
          rendered="$(uv run --frozen python tools/render_consumer.py \
            --template-sha 0000000000000000000000000000000000000000 \
            --template-version v0.0.0)"
          gopath="$(go env GOPATH)"
          export PATH="$gopath/bin:$PATH"
          actionlint "$rendered"/consumer/.github/workflows/*.yml
          uv tool run zizmor --offline "$rendered"/consumer/.github/
          uv run --frozen python tools/workflow_lint.py \
            "$rendered"/consumer/.github/workflows/*.yml

  bwrap-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash actions/fix-agent/preflight.sh
