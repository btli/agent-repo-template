[project]
name = "agent-repo-template"
version = "0.1.0"
description = "A reusable starter template for repository agents."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[tool.pytest.ini_options]
pythonpath = ["lib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
