spec_version: 1
name: agent-repo-review
description: Read-only, summary-only pull request review.
executor:
  type: omnigent
  config:
    harness: claude-sdk
async: false
timers: false
skills: none
instructions: prompt.md
guardrails:
  policies:
    deny_all_tools:
      type: function
      on: [tool_call]
      function:
        path: agent_repo.policies.allow_only
        arguments:
          allowed: []
