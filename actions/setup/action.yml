name: Set up repository agents
description: Install pinned agent runtimes and configure an Anthropic gateway without storing keys.
inputs:
  gateway-url:
    description: HTTPS gateway URL.
    required: true
  gateway-kind:
    description: Gateway kind, databricks or litellm.
    required: true
  model:
    description: Anthropic-family gateway model ID.
    required: true
  api-key-env:
    description: Caller environment variable holding the role key; pass the same name to triage-agent.
    required: false
    default: LLM_API_KEY
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        version: 0.13.1
        enable-cache: false
    - name: Install hash-locked omnigent
      shell: bash
      run: |
        set -euo pipefail
        venv="$RUNNER_TEMP/agent-repo-omnigent"
        if [ ! -x "$venv/bin/python" ]; then
          uv --no-config venv --python 3.12 "$venv"
        fi
        uv --no-config pip install --python "$venv/bin/python" --require-hashes \
          --default-index https://pypi.org/simple -r "$GITHUB_ACTION_PATH/requirements-omnigent.txt"
    - name: Install integrity-locked Claude CLI
      uses: omnigent-ai/omnigent/.github/actions/setup-harness-cli@fbad2c7aaa990e2ff173383ca8dd42d983be7858 # v0.19.1
      with:
        harness: claude
        enable-cache: false
    - name: Configure gateway
      shell: bash
      env:
        GATEWAY_URL: ${{ inputs.gateway-url }}
        GATEWAY_KIND: ${{ inputs.gateway-kind }}
        MODEL: ${{ inputs.model }}
        API_KEY_ENV: ${{ inputs.api-key-env }}
      run: '"$RUNNER_TEMP/agent-repo-omnigent/bin/python" "$GITHUB_ACTION_PATH/configure.py"'
