name: Fix agent (propose)
description: >-
  Run the bwrap-sandboxed fix agent in an agent-branch checkout and build fix.json plus
  fix.patch from git. The checkout's .git directory is moved outside the sandbox root.
  harden-runner blocks egress for the whole job, from job start, outside allowed-endpoints.
  The outbound scan refuses a patch, or any changed binary file, over 64 KiB.
  Any agent change to a .gitattributes file is refused; ones setup installs are kept.
  Git hooks stay off for every git command the action runs, even if setup configures them.
  With feedback-head-sha set, setup runs at base-sha before the prior agent commit is overlaid.
inputs:
  work-path:
    description: >-
      Agent-branch checkout the agent edits, checked out at base-sha (for feedback, at the
      event commit with fetch-depth 0) with persist-credentials false. commands.setup must
      install everything the offline agent needs inside it (gitignored, such as a project
      .venv); setup's HOME is discarded, so test and lint commands must not depend on HOME.
    required: true
  policy-path:
    description: >-
      Separate default-branch checkout with .agents/, AGENTS.md and CONTRIBUTING.md, checked
      out with persist-credentials false.
    required: true
  base-sha:
    description: >-
      Commit the patch is relative to; fix.json echoes it. For feedback it is the Agent-Base of
      feedback-head-sha, on the first-parent chain of the event commit.
    required: true
  feedback-head-sha:
    description: >-
      Prior agent commit H to build on; empty for a new fix. Its message must be exactly the apply
      template "Fix #<n>", a blank line, then one Agent-Base, Agent-Run and Agent-Tests trailer.
    required: false
    default: ""
  feedback-head-ref:
    description: >-
      Agent branch (agent/fix-<n>) that must contain feedback-head-sha; empty for a new fix.
    required: false
    default: ""
  issue-file:
    description: File containing the issue text and maintainer notes.
    required: true
  output-dir:
    description: Directory outside work-path that receives fix.json and fix.patch.
    required: true
  allowed-endpoints:
    description: >-
      harden-runner egress allowlist. It applies to the whole job from its start, so it must
      include the gateway, the package registries commands.setup uses and, if bwrap is not
      preinstalled, the distro package mirror.
    required: true
  api-key-env:
    description: Caller environment variable holding the role key.
    required: false
    default: LLM_API_KEY
  agent-timeout:
    description: Seconds before the agent run is terminated.
    required: false
    default: "2400"
outputs:
  fix-file:
    description: Path to fix.json.
    value: ${{ inputs.output-dir }}/fix.json
runs:
  using: composite
  steps:
    # The runner hoists pre steps of nested actions to job start (runner ADR 1144), so the block
    # covers the consumer's earlier checkout steps too.
    - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: block
        allowed-endpoints: ${{ inputs.allowed-endpoints }}
    - name: Sandbox preflight
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/preflight.sh"
    # Setup is the repository's own default-branch code and runs unsandboxed; a compromised setup
    # dependency could tamper with the runner before the agent step (accepted: small per-role key).
    - name: Project setup
      shell: bash
      env:
        WORK_PATH: ${{ inputs.work-path }}
        POLICY_PATH: ${{ inputs.policy-path }}
        BASE_SHA: ${{ inputs.base-sha }}
        FEEDBACK_HEAD_SHA: ${{ inputs.feedback-head-sha }}
        FEEDBACK_HEAD_REF: ${{ inputs.feedback-head-ref }}
        API_KEY_ENV: ${{ inputs.api-key-env }}
      run: |
        set -euo pipefail
        template_root="$(cd "$GITHUB_ACTION_PATH/../.." && pwd)"
        export PYTHONPATH="$template_root/lib"
        python3 "$GITHUB_ACTION_PATH/run.py" setup
    - name: Run fix agent
      shell: bash
      env:
        WORK_PATH: ${{ inputs.work-path }}
        POLICY_PATH: ${{ inputs.policy-path }}
        BASE_SHA: ${{ inputs.base-sha }}
        FEEDBACK_HEAD_SHA: ${{ inputs.feedback-head-sha }}
        FEEDBACK_HEAD_REF: ${{ inputs.feedback-head-ref }}
        RUN_ID: ${{ github.run_id }}
        ISSUE_FILE: ${{ inputs.issue-file }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        API_KEY_ENV: ${{ inputs.api-key-env }}
        AGENT_TIMEOUT: ${{ inputs.agent-timeout }}
      run: |
        set -euo pipefail
        template_root="$(cd "$GITHUB_ACTION_PATH/../.." && pwd)"
        export PATH="$RUNNER_TEMP/agent-repo-omnigent/bin:$PATH"
        export PYTHONPATH="$template_root/lib"
        python "$GITHUB_ACTION_PATH/run.py" agent
