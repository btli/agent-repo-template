name: Agent gate
description: Authorize triggers and enforce deterministic agent limits.
inputs:
  workflow:
    description: Agent workflow (triage, review or fix).
    required: true
  enabled:
    description: Only the literal true enables agents.
    required: true
  bot-login:
    description: GitHub App bot login.
    required: true
  token:
    description: Read-only repository token with Actions, issues and PR read access.
    default: ${{ github.token }}
outputs:
  run:
    description: Whether the workflow may proceed.
    value: ${{ steps.gate.outputs.run }}
  reason:
    description: Deterministic routing reason.
    value: ${{ steps.gate.outputs.reason }}
  tier2_allowed:
    description: Whether Tier 2 is within both daily caps.
    value: ${{ steps.gate.outputs.tier2_allowed }}
  capped:
    description: Whether the issue reached its triage cycle cap.
    value: ${{ steps.gate.outputs.capped }}
  command:
    description: Parsed command name, or empty.
    value: ${{ steps.gate.outputs.command }}
  command_args:
    description: Arguments from the command's first nonblank line.
    value: ${{ steps.gate.outputs.command_args }}
  canary:
    description: Fresh random marker for output scanning.
    value: ${{ steps.gate.outputs.canary }}
  head_sha:
    description: Pull request head captured when the gate authorized the event.
    value: ${{ steps.gate.outputs.head_sha }}
  issue:
    description: Fix target issue, from the event issue or the agent/fix-<n> head ref.
    value: ${{ steps.gate.outputs.issue }}
  base_sha:
    description: Fix base, the event GITHUB_SHA or the feedback head's Agent-Base trailer.
    value: ${{ steps.gate.outputs.base_sha }}
  head_ref:
    description: Fix branch, agent/fix-<n>.
    value: ${{ steps.gate.outputs.head_ref }}
runs:
  using: composite
  steps:
    - name: Read configuration from the event commit
      if: inputs.enabled == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        path: agent-gate-default
        persist-credentials: false
        token: ${{ inputs.token }}
    - name: Evaluate gate
      id: gate
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../lib
        GATE_WORKFLOW: ${{ inputs.workflow }}
        AGENTS_ENABLED: ${{ inputs.enabled }}
        AGENT_BOT_LOGIN: ${{ inputs.bot-login }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: python3 "$GITHUB_ACTION_PATH/../../lib/agent_repo_cli.py" gate "$GATE_WORKFLOW" "$GITHUB_WORKSPACE/agent-gate-default"

    - name: Prepare authorized fix context
      if: inputs.workflow == 'fix' && steps.gate.outputs.run == 'true'
      shell: bash
      env:
        GATE_FIX_AUTHORIZED: ${{ steps.gate.outputs.run }}
        GATE_FIX_ISSUE: ${{ steps.gate.outputs.issue }}
        GATE_FIX_BASE: ${{ steps.gate.outputs.base_sha }}
        GATE_FIX_CANARY: ${{ steps.gate.outputs.canary }}
        GITHUB_TOKEN: ${{ inputs.token }}
        FIX_CONTEXT_DIR: ${{ runner.temp }}/agent-fix/context
      run: python3 "$GITHUB_ACTION_PATH/../../lib/agent_repo_cli.py" gate fix-context "$FIX_CONTEXT_DIR"
    - name: Share authorized fix context
      if: inputs.workflow == 'fix' && steps.gate.outputs.run == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: agent-fix-context-${{ github.run_id }}
        path: ${{ runner.temp }}/agent-fix/context
        if-no-files-found: error
        retention-days: 1
