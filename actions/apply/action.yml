name: Apply agent proposal
description: Validate, scan and apply a triage artifact with trusted default-branch policy.
inputs:
  mode:
    description: Proposal role, triage or fix.
    default: triage
  patch:
    description: Downloaded cumulative fix patch.
    default: ''
  context-file:
    description: Trusted gate canary artifact from this run.
    default: ''
  work-path:
    description: Credential-free event-time work checkout.
    default: ''
  policy-path:
    description: Credential-free event-time policy checkout.
    default: ''
  fix-issue:
    description: Trusted gate issue output.
    default: ''
  base-sha:
    description: Trusted gate base output.
    default: ''
  feedback-head-sha:
    description: Trusted gate feedback head output.
    default: ''
  feedback-head-ref:
    description: Trusted gate branch output.
    default: ''
  ci-readonly:
    description: Confirmed read-only default CI token permissions.
    default: 'false'
  safe-environments:
    description: Environments confirmed to exclude agent branches.
    default: ''
  artifact:
    description: Path to the downloaded decision JSON.
    required: true
  token:
    description: Repository-scoped GitHub App token.
    required: true
  scan-keys:
    description: Newline-separated AGENT_SCAN_KEYS from the agent-apply environment.
    required: true
  bot-login:
    description: Trusted AGENT_BOT_LOGIN of the GitHub App that posts comments.
    required: true
  canary:
    description: Canary for this triage proposal run.
    default: ''
  capped:
    description: Trusted gate cycle-cap result.
    default: 'false'
  off-authorized:
    description: Trusted gate authorization result for /agent off.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Apply triage
      if: inputs.mode == 'triage'
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../lib
        AGENT_ARTIFACT: ${{ inputs.artifact }}
        GH_TOKEN: ${{ inputs.token }}
        AGENT_SCAN_KEYS: ${{ inputs.scan-keys }}
        AGENT_BOT_LOGIN: ${{ inputs.bot-login }}
        AGENT_CANARY: ${{ inputs.canary }}
        AGENT_CAPPED: ${{ inputs.capped }}
        AGENT_OFF_AUTHORIZED: ${{ inputs.off-authorized }}
      run: python3 "$GITHUB_ACTION_PATH/../../lib/agent_repo_cli.py" apply "$AGENT_ARTIFACT"

    - name: Apply fix
      if: inputs.mode == 'fix'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        AGENT_SCAN_KEYS: ${{ inputs.scan-keys }}
        AGENT_BOT_LOGIN: ${{ inputs.bot-login }}
        FIX_ARTIFACT: ${{ inputs.artifact }}
        FIX_PATCH: ${{ inputs.patch }}
        FIX_WORK: ${{ inputs.work-path }}
        FIX_CONTEXT: ${{ inputs.context-file }}
        FIX_ISSUE: ${{ inputs.fix-issue }}
        FIX_BASE: ${{ inputs.base-sha }}
        FIX_HEAD: ${{ inputs.feedback-head-sha }}
        FIX_REF: ${{ inputs.feedback-head-ref }}
        AGENT_TEMPLATE_REF: ${{ github.action_ref }}
        AGENT_CI_DEFAULT_TOKEN_READONLY: ${{ inputs.ci-readonly }}
        AGENT_SAFE_ENVIRONMENTS: ${{ inputs.safe-environments }}
      run: python3 "$GITHUB_ACTION_PATH/../../lib/agent_repo_cli.py" apply_fix "$FIX_ARTIFACT" "$FIX_PATCH" "$FIX_WORK" "$FIX_CONTEXT"
