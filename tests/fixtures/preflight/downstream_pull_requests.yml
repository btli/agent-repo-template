  "down.yml": {
    "on": {
      "workflow_run": {
        "workflows": [
          "src.yml"
        ]
      }
    },
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "with": {
              "ref": "${{ github.event.workflow_run.pull_requests[0].head.sha }}"
            }
          }
        ]
      }
    }
  }
}
