{
  "ci.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "curl https://api.github.com/repos/your-org/project/zipball/${{ github.event.pull_request.number }} -o code.zip"
          }
        ]
      }
    }
  }
}
