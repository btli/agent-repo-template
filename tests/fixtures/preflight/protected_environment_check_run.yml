{
  "ci.yml": {
    "on": {
      "check_run": {
        "types": [
          "completed"
        ]
      }
    },
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "with": {
              "ref": "${{ github.event.check_run.head_sha }}"
            }
          },
          {
            "run": "make publish"
          }
        ],
        "environment": "release",
        "env": {
          "T": "${{ secrets.NPM_TOKEN }}"
        }
      }
    }
  }
}
