{
  "z-build.yml": {
    "on": "push",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "true"
          }
        ]
      }
    },
    "name": "Build"
  },
  "b-mid.yml": {
    "on": {
      "workflow_run": {
        "workflows": [
          "Build"
        ],
        "types": [
          "completed"
        ]
      }
    },
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "true"
          }
        ]
      }
    },
    "name": "Mid"
  },
  "a-final.yml": {
    "on": {
      "workflow_run": {
        "workflows": [
          "Mid"
        ],
        "types": [
          "completed"
        ],
        "branches": [
          "agent/**"
        ]
      }
    },
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "true"
          }
        ],
        "env": {
          "TOKEN": "${{ secrets.NPM_TOKEN }}"
        }
      }
    },
    "name": "Final"
  }
}
