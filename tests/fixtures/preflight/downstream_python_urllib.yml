{
  "source.yml": {
    "on": "push",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-24.04",
        "steps": [
          {
            "run": "echo ready"
          }
        ]
      }
    },
    "name": "Build"
  },
  "consumer.yml": {
    "on": {
      "workflow_run": {
        "workflows": [
          "Build"
        ],
        "types": [
          "completed"
        ]
      }
    },
    "permissions": {
      "actions": "read"
    },
    "jobs": {
      "check": {
        "runs-on": "ubuntu-24.04",
        "steps": [
          {
            "run": "python3 -c 'import urllib.request; urllib.request.urlopen(\"https://api.github.com/repos/your-org/project/actions/runs/${{ github.event.workflow_run.id }}/artifacts\")'"
          }
        ]
      }
    }
  }
}
