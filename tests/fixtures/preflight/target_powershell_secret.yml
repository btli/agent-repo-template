{
  "ci.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "shell": "pwsh",
            "run": "Invoke-WebRequest https://example.invalid/content -OutFile pr.zip"
          }
        ],
        "env": {
          "TOKEN": "${{ secrets.NPM_TOKEN }}"
        }
      }
    }
  }
}
