{
  "ci.yml": {
    "on": "push",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
            "with": {
              "token": "${{ format('it''s }}{0}', secrets.NPM_TOKEN) }}"
            }
          }
        ]
      }
    }
  }
}
