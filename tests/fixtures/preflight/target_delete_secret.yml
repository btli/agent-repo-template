{
  "ci.yml": {
    "on": "delete",
    "permissions": {
      "contents": "write"
    },
    "jobs": {
      "check": {
        "runs-on": "ubuntu-24.04",
        "steps": [
          {
            "run": "echo cleaning ${{ github.event.ref }}"
          }
        ],
        "env": {
          "DEPLOY_KEY": "${{ secrets.DEPLOY_KEY }}"
        }
      }
    }
  }
}
