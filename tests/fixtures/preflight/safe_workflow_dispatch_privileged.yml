{
  "ci.yml": {
    "on": "workflow_dispatch",
    "permissions": {
      "contents": "write"
    },
    "jobs": {
      "check": {
        "runs-on": "ubuntu-24.04",
        "steps": [
          {
            "run": "echo ready"
          }
        ],
        "env": {
          "TOKEN": "${{ secrets.DEPLOY_KEY }}"
        }
      }
    }
  }
}
