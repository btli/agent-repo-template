{
  "caller.yml": {
    "on": "push",
    "permissions": {},
    "jobs": {
      "call": {
        "uses": "./.github/workflows/callee.yml"
      }
    }
  },
  "callee.yml": {
    "on": "workflow_call",
    "permissions": {},
    "jobs": {
      "call": {
        "uses": "./.github/workflows/leaf.yml",
        "secrets": "inherit"
      }
    }
  },
  "leaf.yml": {
    "on": "workflow_call",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "echo ready",
            "env": {
              "TOKEN": "${{ secrets.TOKEN }}"
            }
          }
        ]
      }
    }
  }
}
