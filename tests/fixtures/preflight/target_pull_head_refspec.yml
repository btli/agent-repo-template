{
  "ci.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "git fetch origin pull/${{ github.event.pull_request.number }}/head:pr && git checkout pr && make test"
          }
        ]
      }
    }
  }
}
