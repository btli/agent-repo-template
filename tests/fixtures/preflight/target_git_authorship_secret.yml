{
  "ci.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "git config user.name automation\ngit config user.email automation@example.invalid"
          }
        ],
        "env": {
          "TOKEN": "${{ secrets.NPM_TOKEN }}"
        }
      }
    }
  }
}
