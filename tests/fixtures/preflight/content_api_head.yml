{
  "ci.yml": {
    "on": "issue_comment",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "SHA=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} --jq .head.sha); git fetch origin \"$SHA\" && git checkout \"$SHA\""
          }
        ]
      }
    }
  }
}
