{
  "ci.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "printf \"%s\" \"${{ toJSON(github.event.pull_request) }}\" | python3 select.py"
          }
        ]
      }
    }
  }
}
