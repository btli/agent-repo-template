{
  "caller.yml": {
    "on": {
      "push": {
        "branches": [
          "main"
        ]
      }
    },
    "permissions": {},
    "jobs": {
      "call": {
        "uses": "./.github/workflows/callee.yml"
      }
    }
  },
  "callee.yml": {
    "on": "workflow_call",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "permissions": {},
        "environment": "${{ inputs.environment }}",
        "steps": [
          {
            "run": "true"
          }
        ]
      }
    }
  }
}
