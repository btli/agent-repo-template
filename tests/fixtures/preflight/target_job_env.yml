{
  "ci.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
          },
          {
            "run": "git fetch origin \"$HEAD\" && git checkout \"$HEAD\""
          }
        ],
        "env": {
          "HEAD": "${{ github.event.pull_request.head.sha }}"
        }
      }
    }
  }
}
