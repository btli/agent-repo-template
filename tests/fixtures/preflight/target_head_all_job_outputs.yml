{
  "ci.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
            "with": {
              "ref": "${{ needs.meta.outputs.sha }}"
            }
          }
        ],
        "needs": "meta"
      },
      "meta": {
        "runs-on": "ubuntu-latest",
        "outputs": {
          "sha": "${{ github.event.pull_request.head.sha }}"
        },
        "steps": [
          {
            "run": "echo ready"
          }
        ]
      }
    }
  }
}
