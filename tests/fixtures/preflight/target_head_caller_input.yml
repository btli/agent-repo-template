{
  "caller.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "call": {
        "uses": "./.github/workflows/callee.yml",
        "with": {
          "ref": "${{ github.event.pull_request.head.sha }}"
        }
      }
    }
  },
  "callee.yml": {
    "on": {
      "workflow_call": {
        "inputs": {
          "ref": {
            "type": "string"
          }
        }
      }
    },
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "with": {
              "ref": "${{ inputs.ref }}"
            }
          },
          {
            "run": "make"
          }
        ]
      }
    }
  }
}
