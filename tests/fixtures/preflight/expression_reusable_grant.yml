{
  "caller.yml": {
    "on": "push",
    "permissions": {},
    "jobs": {
      "call": {
        "uses": "./.github/workflows/callee.yml",
        "secrets": {
          "TOKEN": "${{ format('}}{0}', secrets.NPM_TOKEN) }}"
        }
      }
    }
  },
  "callee.yml": {
    "on": "workflow_call",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "echo ready"
          }
        ],
        "env": {
          "TOKEN": "${{ secrets.TOKEN }}"
        }
      }
    }
  }
}
