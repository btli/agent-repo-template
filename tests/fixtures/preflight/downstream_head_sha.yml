{
  "build.yml": {
    "on": "push",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "echo safe"
          }
        ]
      }
    },
    "name": "Build"
  },
  "down.yml": {
    "on": {
      "workflow_run": {
        "workflows": [
          "Build"
        ],
        "types": [
          "completed"
        ]
      }
    },
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
            "with": {
              "ref": "${{ github.event.workflow_run.head_sha }}"
            }
          }
        ]
      }
    }
  }
}
