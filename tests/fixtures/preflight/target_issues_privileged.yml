{
  "ci.yml": {
    "on": {
      "issues": {
        "types": [
          "opened"
        ]
      }
    },
    "permissions": {
      "contents": "write"
    },
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "echo \"${{ github.event.issue.body }}\" | bash"
          }
        ]
      }
    }
  }
}
