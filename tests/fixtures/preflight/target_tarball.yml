{
  "ci.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "gh api repos/your-org/project/tarball/${{ github.event.pull_request.number }} > code.tar"
          }
        ]
      }
    }
  }
}
