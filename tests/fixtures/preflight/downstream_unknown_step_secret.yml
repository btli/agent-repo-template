{
  "source.yml": {
    "name": "Build",
    "on": "pull_request",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "echo ready"
          }
        ]
      }
    }
  },
  "down.yml": {
    "on": {
      "workflow_run": {
        "workflows": [
          "Build"
        ],
        "types": [
          "completed"
        ]
      }
    },
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "echo ready",
            "future-input": {
              "credential": "${{ secrets.NPM_TOKEN }}"
            }
          }
        ]
      }
    }
  }
}
