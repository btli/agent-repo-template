{
  "ci.yml": {
    "on": {
      "issue_comment": {
        "types": [
          "created"
        ]
      }
    },
    "permissions": {
      "contents": "read"
    },
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "gh pr checkout ${{ github.event.issue.number }} && make test",
            "env": {
              "GH_TOKEN": "${{ github.token }}"
            }
          }
        ]
      }
    }
  }
}
