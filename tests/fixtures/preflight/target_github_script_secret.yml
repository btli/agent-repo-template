{
  "ci.yml": {
    "on": "issue_comment",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/github-script@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "with": {
              "script": "await github.rest.issues.createComment({body: \"Thanks\"})"
            }
          }
        ],
        "env": {
          "TOKEN": "${{ secrets.NPM_TOKEN }}"
        }
      }
    }
  }
}
