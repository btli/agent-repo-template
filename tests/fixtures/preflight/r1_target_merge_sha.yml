{
  "ci.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
            "with": {
              "ref": "${{ github.event.pull_request.merge_commit_sha }}"
            }
          }
        ]
      }
    }
  }
}
