{
  "src.yml": {
    "on": "push",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "echo ready"
          }
        ]
      }
    }
  },
  "down.yml": {
    "on": {
      "workflow_run": {
        "workflows": [
          "src.yml"
        ]
      }
    },
    "permissions": {
      "actions": "read"
    },
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/github-script@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "with": {
              "script": "await github.rest.actions.listWorkflowRunArtifacts({run_id: 1})"
            }
          }
        ]
      }
    }
  }
}
