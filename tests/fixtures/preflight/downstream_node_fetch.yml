{
  "source.yml": {
    "on": "push",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-24.04",
        "steps": [
          {
            "run": "echo ready"
          }
        ]
      }
    },
    "name": "Build"
  },
  "consumer.yml": {
    "on": {
      "workflow_run": {
        "workflows": [
          "Build"
        ],
        "types": [
          "completed"
        ]
      }
    },
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-24.04",
        "steps": [
          {
            "run": "node -e \"fetch(process.env.API+'/repos/'+process.env.GITHUB_REPOSITORY+'/actions/artifacts').then(r=>r.json())\""
          }
        ]
      }
    }
  }
}
