{
  "ci.yml": {
    "on": "issue_comment",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "echo ready"
          }
        ],
        "services": {
          "database": {
            "image": "postgres:16",
            "env": {
              "X": "${{ secrets.NPM_TOKEN }}"
            }
          }
        }
      }
    }
  }
}
