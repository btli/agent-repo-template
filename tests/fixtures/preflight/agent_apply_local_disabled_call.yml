{
  "caller.yml": {
    "on": "push",
    "permissions": {},
    "jobs": {
      "call": {
        "uses": "./.github/workflows/callee.yml",
        "if": false
      }
    }
  },
  "callee.yml": {
    "on": "workflow_call",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "permissions": {},
        "environment": "agent-apply",
        "steps": [
          {
            "run": "true"
          }
        ]
      }
    }
  }
}
