{
  "ci.yml": {
    "on": "issue_comment",
    "permissions": {
      "contents": "write"
    },
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "echo ready"
          }
        ],
        "env": {
          "TOKEN": "${{ secrets.GITHUB_TOKEN }}"
        }
      }
    }
  }
}
