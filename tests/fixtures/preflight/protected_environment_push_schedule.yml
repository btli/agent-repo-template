{
  "ci.yml": {
    "on": {
      "push": null,
      "schedule": [
        {
          "cron": "0 0 * * *"
        }
      ]
    },
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "echo ready"
          }
        ],
        "environment": "release",
        "env": {
          "T": "${{ secrets.NPM_TOKEN }}"
        }
      }
    }
  }
}
