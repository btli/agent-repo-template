{
  "ci.yml": {
    "on": "pull_request_comment",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "with": {
              "ref": "${{ github.event.pull_request_comment.head_sha }}"
            }
          },
          {
            "run": "make publish"
          }
        ],
        "environment": "release",
        "env": {
          "T": "${{ secrets.NPM_TOKEN }}"
        }
      }
    }
  }
}
