{
  "ci.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "git fetch origin $(jq -r .pull_request.head.sha \"$GITHUB_EVENT_PATH\") && git checkout FETCH_HEAD"
          }
        ]
      }
    }
  }
}
