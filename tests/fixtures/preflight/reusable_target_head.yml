{
  "caller.yml": {
    "on": "pull_request_target",
    "permissions": {},
    "jobs": {
      "call": {
        "uses": "./.github/workflows/callee.yml"
      }
    }
  },
  "callee.yml": {
    "on": "workflow_call",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "with": {
              "ref": "${{ github.head_ref }}"
            }
          }
        ]
      }
    }
  }
}
