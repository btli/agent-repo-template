{
  "ci.yml": {
    "on": "pull_request_target",
    "permissions": {
      "pull-requests": "write"
    },
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
          },
          {
            "uses": "actions/labeler@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          }
        ],
        "env": {
          "TOKEN": "${{ secrets.NPM_TOKEN }}"
        }
      }
    }
  }
}
