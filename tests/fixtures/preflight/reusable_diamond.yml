{
  "root.yml": {
    "on": [
      "push",
      "workflow_call"
    ],
    "permissions": {},
    "jobs": {
      "left": {
        "uses": "./.github/workflows/left.yml"
      },
      "right": {
        "uses": "./.github/workflows/right.yml"
      }
    }
  },
  "left.yml": {
    "on": "workflow_call",
    "permissions": {},
    "jobs": {
      "call": {
        "uses": "./.github/workflows/shared.yml"
      }
    }
  },
  "right.yml": {
    "on": "workflow_call",
    "permissions": {},
    "jobs": {
      "call": {
        "uses": "./.github/workflows/shared.yml"
      }
    }
  },
  "shared.yml": {
    "on": "workflow_call",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "true"
          }
        ]
      }
    }
  }
}
