{
  "caller.yml": {
    "on": "push",
    "permissions": {
      "contents": "write"
    },
    "jobs": {
      "call": {
        "uses": "./.github/workflows/callee.yml"
      }
    }
  },
  "callee.yml": {
    "on": "workflow_call",
    "permissions": {},
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "run": "echo safe"
          }
        ],
        "permissions": {
          "packages": "write"
        }
      }
    }
  }
}
