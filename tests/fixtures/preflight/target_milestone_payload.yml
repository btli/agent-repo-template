{
  "ci.yml": {
    "on": "milestone",
    "permissions": {
      "contents": "write"
    },
    "jobs": {
      "check": {
        "runs-on": "ubuntu-latest",
        "steps": [
          {
            "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
            "with": {
              "ref": "${{ github.event.milestone.title }}"
            }
          },
          {
            "run": "make deploy",
            "env": {
              "TOKEN": "${{ secrets.DEPLOY_TOKEN }}"
            }
          }
        ]
      }
    }
  }
}
