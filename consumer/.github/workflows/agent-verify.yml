name: Agent fix verification
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions: {contents: read}
jobs:
  verify:
    if: startsWith(github.head_ref, 'agent/fix-') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - name: Checkout verification policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      - name: Checkout verification work
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - name: Verify red and green results
        # zizmor: ignore[unpinned-uses] Bootstrap resolves the template pin.
        uses: btli/agent-repo-template/actions/verify@__TEMPLATE_SHA__ # __TEMPLATE_VERSION__
        with:
          work-path: work
          policy-path: policy
          bot-login: ${{ vars.AGENT_BOT_LOGIN }}
