name: Agent fix
on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.gate.outputs.run }}
      issue: ${{ steps.gate.outputs.issue }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
    steps:
      - id: gate
        # zizmor: ignore[unpinned-uses] Bootstrap resolves the template pin.
        uses: btli/agent-repo-template/actions/gate@__TEMPLATE_SHA__ # __TEMPLATE_VERSION__
        with:
          workflow: fix
          enabled: ${{ vars.AGENTS_ENABLED }}
          bot-login: ${{ vars.AGENT_BOT_LOGIN }}
  propose:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: agent-propose-fix
    permissions: {contents: read}
    concurrency:
      group: agent-fix-propose-${{ needs.gate.outputs.issue }}
      cancel-in-progress: true
    steps:
      - name: Checkout fix policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false
      - name: Checkout fix work
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - name: Download gate context
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: agent-fix-context-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-fix/context
      - name: Set up repository agent
        # zizmor: ignore[unpinned-uses] Bootstrap resolves the template pin.
        uses: btli/agent-repo-template/actions/setup@__TEMPLATE_SHA__ # __TEMPLATE_VERSION__
        with:
          gateway-url: ${{ vars.AGENT_GATEWAY_URL }}
          gateway-kind: ${{ vars.AGENT_GATEWAY_KIND }}
          model: ${{ vars.AGENT_FIX_MODEL }}
          api-key-env: AGENT_FIX_KEY
      - name: Propose fix
        # zizmor: ignore[unpinned-uses] Bootstrap resolves the template pin.
        uses: btli/agent-repo-template/actions/fix-agent@__TEMPLATE_SHA__ # __TEMPLATE_VERSION__
        with:
          work-path: work
          policy-path: policy
          base-sha: ${{ needs.gate.outputs.base_sha }}
          feedback-head-sha: ${{ needs.gate.outputs.head_sha }}
          feedback-head-ref: ${{ needs.gate.outputs.head_ref }}
          api-key-env: AGENT_FIX_KEY
          agent-timeout: 1500
          allowed-endpoints: ${{ vars.AGENT_FIX_ALLOWED_ENDPOINTS }}
          issue-file: ${{ runner.temp }}/agent-fix/context/issue.txt
          output-dir: ${{ runner.temp }}/agent-fix/proposal
        env:
          AGENT_FIX_KEY: ${{ secrets.AGENT_FIX_KEY }}
      - name: Share fix proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-fix-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agent-fix/proposal/fix.json
            ${{ runner.temp }}/agent-fix/proposal/fix.patch
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: [gate, propose]
    if: needs.propose.result == 'success'
    runs-on: ubuntu-24.04
    environment: agent-apply
    permissions: {contents: read}
    steps:
      - name: Checkout fix policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false
      - name: Checkout fix work
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - name: Download fix proposal
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: agent-fix-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-fix/apply
      - name: Download gate context
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: agent-fix-context-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-fix/context
      - name: Create fix App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Apply fix
        # zizmor: ignore[unpinned-uses] Bootstrap resolves the template pin.
        uses: btli/agent-repo-template/actions/apply@__TEMPLATE_SHA__ # __TEMPLATE_VERSION__
        with:
          mode: fix
          artifact: ${{ runner.temp }}/agent-fix/apply/fix.json
          patch: ${{ runner.temp }}/agent-fix/apply/fix.patch
          context-file: ${{ runner.temp }}/agent-fix/context/canary.json
          work-path: work
          policy-path: policy
          fix-issue: ${{ needs.gate.outputs.issue }}
          base-sha: ${{ needs.gate.outputs.base_sha }}
          feedback-head-sha: ${{ needs.gate.outputs.head_sha }}
          feedback-head-ref: ${{ needs.gate.outputs.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          scan-keys: ${{ secrets.AGENT_SCAN_KEYS }}
          bot-login: ${{ vars.AGENT_BOT_LOGIN }}
          ci-readonly: ${{ vars.AGENT_CI_DEFAULT_TOKEN_READONLY }}
          safe-environments: ${{ vars.AGENT_SAFE_ENVIRONMENTS }}
      - name: Retain validated fix proposal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-fix-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agent-fix/apply/fix.json
            ${{ runner.temp }}/agent-fix/apply/fix.patch
            ${{ runner.temp }}/agent-fix/apply/preflight.json
          if-no-files-found: error
          retention-days: 1
