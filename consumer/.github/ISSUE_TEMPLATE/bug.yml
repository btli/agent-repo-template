name: Bug report
description: Report incorrect or broken project behavior.
title: "[Bug]: "
labels: [type:bug]
body:
  - type: markdown
    attributes:
      value: Share a concise, reproducible report. Do not include credentials or private data.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which project version are you using?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Include minimal logs or examples, with private data removed.
